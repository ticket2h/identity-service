spring:
  application:
    name: identity-service
  config:
    # Secret dùng chung cho cả hệ thống nằm ở ../infra/.env (tạo bằng infra/scripts/init-env.sh), không commit.
    # File .env cạnh pom.xml (nếu có) dùng để ghi đè riêng cho service này.
    import:
      - optional:file:../infra/.env[.properties]
      - optional:file:.env[.properties]
  datasource:
    # Database riêng của identity-service (infra/postgres/init tạo user và database "identity")
    url: jdbc:postgresql://localhost:5432/identity
    username: identity
    password: identity
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none        # Flyway quản lý schema

server:
  port: 8082

springdoc:
  # Mặc định springdoc ghi "*/*" cho mọi response; ghi rõ JSON để kiểu TypeScript sinh ra (web-app) gọn hơn
  default-produces-media-type: application/json

management:
  endpoints:
    web:
      exposure:
        include: health,info

ticket2h:
  jwt:
    issuer: ticket2h
    ttl: PT1H
    key-id: k1                          # "kid" trong header JWT, khớp với khoá trong /.well-known/jwks.json
    private-key: ${JWT_PRIVATE_KEY}     # RSA 2048, PKCS#8 DER, base64 một dòng
  refresh-token:
    # Refresh token sống trong cookie httpOnly, xoay vòng mỗi lần dùng (POST /auth/refresh). Xem README, mục "Refresh token"
    ttl: P14D
    cookie-path: /auth      # gateway (nginx của web-app) đổi thành /api/identity/auth bằng proxy_cookie_path
    cookie-secure: true     # trình duyệt vẫn nhận cookie Secure trên http://localhost
  internal-api:
    # Service nào được gọi /internal/** và bằng khoá nào (header X-Internal-Api-Key). Xem infra/docs/contracts.md
    clients:
      core-service: ${INTERNAL_API_KEY_CORE}
      notification-service: ${INTERNAL_API_KEY_NOTIFICATION}
